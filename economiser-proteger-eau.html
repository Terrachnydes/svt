<script>
/* ================== MODÈLE 1 : LE POTAGER EXPÉRIMENTAL ==================
   Potager de 10 m² (10 plantes) suivi pendant 14 jours d'été jusqu'à la récolte.
   1 mm d'eau sur le potager = 10 litres. Pas de temps : 1 heure. Valeurs fictives et simplifiées.
   Réservoirs : S = surface du sol (s'évapore vite), W = zone des racines, X = eau en excès (sol saturé).
   Flux : arrosage → évaporé dans l'air / tombé dans les allées / surface / racines ;
          surface → évaporation ou descente ; racines → transpiration des plantes ;
          excès → part trop profond (lentement en sol argileux : les racines manquent d'air). */
const AIRE = 10, NB_PLANTES = 10, NB_JOURS = 14;
const METEO = {
  normal: { nom: 'Été normal', et0: [5, 5.5, 6, 5.5, 5, 5.5, 6, 6.5, 6, 5.5, 5, 5, 5.5, 6] },
  canicule: { nom: 'Canicule', et0: [5.5, 6.5, 7.5, 8, 8.5, 8.5, 8, 8, 7.5, 7, 6.5, 6, 6, 6] }
};
const PLANTES = {
  courgette: { nom: 'Courgettes', kg: 1.6, Kc: 1.05, Wmax: 34, p: 0.5, info: 'Grandes feuilles qui transpirent beaucoup : très gourmandes en eau.' },
  tomate: { nom: 'Tomates', kg: 1.2, Kc: 0.9, Wmax: 38, p: 0.45, info: "Besoins en eau moyens à forts, racines assez profondes." },
  haricot: { nom: 'Haricots', kg: 0.45, Kc: 0.8, Wmax: 26, p: 0.45, info: 'Racines peu profondes : ils supportent mal que le sol sèche.' },
  pasteque: { nom: 'Pastèques', kg: 1.35, Kc: 0.68, Wmax: 56, p: 0.3, info: "Plante originaire des régions chaudes et sèches d'Afrique : feuilles très découpées, très longues racines. Gros fruits." }
};
const SOLS = {
  sable: { nom: 'Sableux', perco: 0.25, ruiss: 0, fW: 0.6, cap: 1.5, drain: 0.4, excesDrain: 0.85, evap: 0.85, info: "Gros grains, beaucoup d'espace entre eux : l'eau s'infiltre très vite mais le sol en garde peu. L'eau en trop part vite en profondeur." },
  limon: { nom: 'Terre de jardin', perco: 0.04, ruiss: 0, fW: 1, cap: 4, drain: 0.16, excesDrain: 0.4, evap: 1, info: "Mélange équilibré de sable, de limon et d'argile, riche en humus : il retient bien l'eau et la laisse s'infiltrer." },
  argile: { nom: 'Argileux', perco: 0, ruiss: 0.12, fW: 1.25, cap: 6.5, drain: 0.06, excesDrain: 0.05, evap: 1.25, info: "Grains très fins et serrés : il retient beaucoup d'eau, mais l'eau s'infiltre lentement et reste longtemps en surface. Trop arrosé, il se gorge d'eau et les racines manquent d'air. Sec, il se fissure." }
};
const METHODES = {
  jet: { nom: 'Jet (tuyau)', info: "Le jet arrose toute la surface, y compris les allées. Des gouttelettes s'évaporent dans l'air ou sont emportées par le vent." },
  arrosoir: { nom: 'Arrosoir au pied', info: "L'eau est versée au pied de chaque plante : presque rien ne tombe dans les allées. Mais la terre autour du pied est mouillée en surface." },
  goutte: { nom: 'Goutte-à-goutte', info: "Un tuyau percé de goutteurs dépose l'eau goutte à goutte au pied de chaque plante. L'eau s'infiltre lentement et forme une zone humide (un « bulbe ») autour des racines ; la surface reste presque sèche." }
};
/* Quantité d'eau par arrosage : niveaux adaptés à chaque plante.
   « Moyennement » = ce qu'un jardinier donne habituellement à cette plante (10 plantes). */

function labFinish() {

  const kA = recolteKg(A.s, ca), kB = recolteKg(B.s, cb), gA = gParLitre(kA, A.s.used), gB = gParLitre(kB, B.s.used);
  const diff = PARAMS.map(p => p.k).filter(k => A.cfg[k] !== B.cfg[k]);
  let verdict;
  if (Math.abs(kA - kB) < 0.05 && A.s.used === B.s.used) verdict = 'Les deux potagers donnent le même résultat.';
  else if (gA !== null && gB !== null) {
    const best = gA > gB ? 'A' : 'B', o = best === 'A' ? 'B' : 'A', kb = best === 'A' ? kA : kB, ko = best === 'A' ? kB : kA, gb = Math.max(gA, gB), go = Math.min(gA, gB);
    verdict = `Le potager <b>${best}</b> utilise mieux l'eau : ${fmt(gb, 1)} g de récolte par litre contre ${fmt(go, 1)} g pour ${o}${go > 0 && gb / go <= 10 ? `, soit ${fmt(gb / go, 1).replace(',0', '')} fois plus` : ''}.`;
    if (ko > kb + 0.3) verdict += ` Mais ${o} a produit plus de kilos (${kgTxt(ko)} contre ${kgTxt(kb)}) : il faut aussi nourrir les gens !`;
  } else verdict = "Un des potagers n'a pas été arrosé : compare surtout les kilos récoltés.";
  const res = $('#p-labo [data-result]'); res.className = 'card result';
  const col = L => { const s = LAB.sides[L].s, k = L === 'A' ? kA : kB; return `<div class="${L}"><span class="label">Potager ${L}</span><div class="n num">${kgTxt(k)}</div><span class="num">avec ${fmt(s.used)} L</span><br><b class="num">${gplTxt(k, s.used)}</b></div>`; };
  res.innerHTML = `<h3>Résultats et explications</h3>
    <div class="duo-res">${col('A')}${col('B')}</div>
    <p style="margin:0">${verdict}</p>
    ${['A', 'B'].map(L => `<h4 class="why-h"><span class="chip-ab ${L}">${L}</span> Que s'est-il passé ?</h4><ul class="why">${pourquoi(L).map(t => `<li>${t}</li>`).join('')}</ul>`).join('')}
    ${diffHTML(diff, A.cfg, B.cfg, false)}
    <p class="small muted" style="margin:8px 0 0">Change un paramètre et relance pour continuer ta recherche.</p>`;
}
function labExplainAt(L, x, y) {
  const sd = LAB.sides[L], cfg = sd.cfg, rb = rootBottom({ ...cfg, meteo: LAB.meteo }), sp = sd.deco.sunPos || [0, 0]; let k;
  if (Math.hypot(x - sp[0], y - sp[1]) < 40) k = 'soleil';
  else if (x < 80 && y > GROUND - 60 && y < GROUND) k = 'robinet';
  else if (y >= rb) k = 'profond';
  else if (y >= GROUND + 18) k = sd.s.X > 2.5 ? 'asphyxie' : (cfg.methode !== 'jet' && sd.deco.bulb.to > 0.1 && y < GROUND + 80 ? 'bulbe' : 'racines');
  else if (y >= GROUND - 8 && (x < 90 || x > 550)) k = 'allees';
  else if (y >= GROUND - 10) k = cfg.paillage ? 'paillage' : cfg.methode === 'goutte' ? 'goutte' : 'surface';
  else if (y > GROUND - 125 && x > 90 && x < 550) k = 'plantes';
  else k = 'ciel';
  const root = $('#p-labo');
  if (k === 'goutte') return showExplain(root, ['Le goutte-à-goutte', "Un tuyau posé au sol, percé de goutteurs. Observe les gouttes et la zone humide qui se forme dans le sol sous chaque plante."]);
  showExplain(root, INFO[k]);
}
/* ======================= ONGLET 2 : BIO OU INTENSIF ======================= */
const BIO_TAB = {
  consigne: "Deux champs de céréales voisins, cultivés chacun de la même façon depuis plus de 10 ans. On les suit pendant un an, de mars à février, sous la même pluie. Observe ce que l'eau de pluie emporte vers la nappe et la rivière.",
  A: { nom: 'Agriculture intensive', sub: 'Engrais et pesticides de synthèse ; sol nu en hiver.' },
  B: { nom: 'Agriculture biologique', sub: 'Fumier et compost, sans engrais ni pesticides de synthèse ; rotation des cultures, couvert végétal en hiver.' },
  retenir: "Sans engrais ni pesticides de synthèse, avec un sol couvert et riche en vers de terre, l'agriculture biologique pollue beaucoup moins l'eau des nappes et des rivières. Mais elle produit moins par hectare.",
  limites: [['plus', 'Beaucoup moins de nitrates et pas de pesticides de synthèse dans l\'eau.'], ['plus', 'Sol plus vivant, qui retient mieux l\'eau et s\'érode moins.'], ['moins', 'Rendement plus faible : en moyenne 20 à 25 % de moins, et davantage pour certaines cultures comme le blé.'], ['moins', 'Plus de travail (désherbage mécanique) et des produits plus chers.'], ['moins', "Le bio utilise quelques produits naturels, comme le cuivre contre les champignons, qui s'accumule dans les sols. Le fumier épandu en trop peut aussi polluer."]]
};
const BIO = { running: false, speed: 1, tIn: 0, dur: 1, done: false, sides: {} };
function bioSideHTML(L) {
  const d = BIO_TAB[L];
  return `<article class="side ${L}"><div class="side-h"><span class="letter">${L}</span><h3>${d.nom}</h3><span class="sub">${d.sub}</span></div>
    <div class="cv"><canvas width="640" height="420" data-cv="${L}" aria-label="Champ animé : ${d.nom}"></canvas><span class="hint">Clique sur le dessin</span></div>
    <div class="metrics">
    <div class="mrow"><span class="k">Rendement de la récolte</span><span class="val num" data-m="rdt">—</span><span class="bar"><i data-b="rdt" style="width:0"></i></span><span class="note">100 = champ intensif. Récolte en juillet.</span></div>
    <div class="mrow"><span class="k">Nitrates dans l'eau qui rejoint la nappe</span><span class="val num" data-m="no3">—</span><span class="bar"><i data-b="no3" style="width:0"></i><span class="mark" style="left:50%"></span></span><span class="note">Trait : 50 mg/L, limite réelle pour l'eau potable.</span></div>
    <div class="mrow"><span class="k">Pesticides de synthèse dans l'eau</span><span class="val num" data-m="pest">—</span><span class="bar"><i data-b="pest" style="width:0"></i><span class="mark" style="left:20%"></span></span><span class="note">Trait : 0,1 µg/L, limite réelle pour l'eau potable (par substance).</span></div>
    <div class="mrow"><span class="k">Eau de pluie qui ruisselle vers la rivière</span><span class="val num" data-m="ruis">—</span><span class="bar"><i data-b="ruis" style="width:0"></i></span></div>
    <div class="mrow"><span class="k">Terre emportée (érosion)</span><span class="val num" data-m="ero">—</span><span class="bar"><i data-b="ero" style="width:0"></i></span></div>
    <div class="mrow"><span class="k">Vers de terre</span><span class="val num">${SYSTEMES[L === 'A' ? 'intensif' : 'bio'].vers} / m²</span></div></div></article>`;
}
function bioHTML() {
  return `<section id="p-bio" role="tabpanel" aria-labelledby="tab-bio" hidden>
    <div class="intro"><h2>Agriculture biologique ou agriculture intensive</h2><span class="tag-fict">Simulation · valeurs fictives</span><p>${BIO_TAB.consigne}</p></div>
    <div class="toolbar"><div class="settings"><div class="small muted" style="max-width:52ch">Un an de culture, de mars à février, avec un orage en mai. Le tracteur indique un épandage d'engrais (vert) ou un traitement pesticide (violet).</div>
      <div class="clock"><b class="num" data-clock></b><span class="prog"><i data-prog></i></span></div></div>
      <div class="runbox"><button class="btn primary" data-act="run">Lancer</button><button class="btn ghost" data-act="pause" disabled>Pause</button><button class="btn ghost" data-act="reset">Réinitialiser</button>
      <span class="seg" role="group" aria-label="Vitesse"><button data-speed="1" aria-pressed="true">×1</button><button data-speed="3" aria-pressed="false">×3</button></span></div></div>
    <div class="duo">${bioSideHTML('A')}${bioSideHTML('B')}</div>
    <div class="fate-l" style="margin-top:8px"><span><i style="background:#2F7CC0"></i>Eau de pluie</span><span><i style="background:#8A6A3E"></i>Ruissellement et terre emportée</span><span><i style="background:#9BE23C"></i>Nitrates entraînés</span><span><i style="background:#B04BE0"></i>Pesticides de synthèse</span><span><i style="background:#D98A8A"></i>Vers de terre</span></div>
    <div class="card explain empty" data-explain style="margin-top:12px">Clique sur un élément d'un dessin (céréale, sol, nappe, rivière, pluie) pour lire une courte explication.</div>
    <div class="below"><div class="card result wait" data-result><h3>Résultat</h3><p style="margin:0">Lance la simulation : le résultat s'affichera à la fin.</p></div>
      <div class="card limits"><h3>Avantages et limites</h3><ul>${BIO_TAB.limites.map(([c, t]) => `<li class="${c}">${t}</li>`).join('')}</ul><p class="sources">Valeurs simplifiées pour la classe. Les seuils de potabilité (50 mg/L de nitrates, 0,1 µg/L par pesticide) sont des valeurs réelles.</p></div></div>
  </section>`;
}
function bioInit() {
  const root = $('#p-bio');
  ['A', 'B'].forEach(L => {
    const cv = $(`[data-cv="${L}"]`, root), ctx = cv.getContext('2d');
    BIO.sides[L] = { cv, ctx, deco: newDeco(), P: { list: [], acc: {} }, el: $(`.side.${L}`, root) };
    new ResizeObserver(() => { const dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth || 640; cv.width = Math.round(w * dpr); cv.height = Math.round(w * 420 / 640 * dpr); ctx.setTransform(cv.width / CW, 0, 0, cv.height / CH, 0, 0); bioDraw(0); }).observe(cv);
    cv.addEventListener('click', e => { const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * CW / r.width, y = (e.clientY - r.top) * CH / r.height;
      const k = x > 545 && y > FG - 20 && y < FG + 60 ? 'riviere' : y >= NAPPE_Y ? 'nappebio' : y >= FG ? 'solbio' : y > FG - 85 && x < 550 ? 'ble' : 'pluiebio'; showExplain(root, INFO[k]); });
  });
  $('[data-act=run]', root).onclick = () => { if (BIO.done) bioReset(); BIO.running = true; bioUI(); };
  $('[data-act=pause]', root).onclick = () => { BIO.running = false; bioUI(); };
  $('[data-act=reset]', root).onclick = () => bioReset();
  $$('[data-speed]', root).forEach(b => b.onclick = () => { BIO.speed = +b.dataset.speed; $$('[data-speed]', root).forEach(x => x.setAttribute('aria-pressed', x === b)); });
  bioReset();
}
function bioReset() {
  BIO.running = false; BIO.done = false; BIO.tIn = 0; BIO.dur = 1;
  BIO.sides.A.c = initChamp('intensif'); BIO.sides.B.c = initChamp('bio');
  ['A', 'B'].forEach(L => BIO.sides[L].P = { list: [], acc: {} });
  const res = $('#p-bio [data-result]'); res.className = 'card result wait'; res.innerHTML = '<h3>Résultat</h3><p style="margin:0">Lance la simulation : le résultat s\'affichera à la fin.</p>';
  bioUI(); bioMetrics(); bioDraw(0);
}
function bioUI() { const r = $('#p-bio'); $('[data-act=run]', r).textContent = BIO.done ? 'Relancer' : BIO.sides.A.c.mois ? 'Reprendre' : 'Lancer'; $('[data-act=run]', r).disabled = BIO.running; $('[data-act=pause]', r).disabled = !BIO.running; }
function bioTick(dt) {
  if (BIO.running) {
    BIO.tIn += dt * BIO.speed;
    if (BIO.tIn >= BIO.dur || BIO.sides.A.c.mois === 0) {
      BIO.tIn = 0;
      ['A', 'B'].forEach(L => moisChamp(BIO.sides[L].c));
      const f = BIO.sides.A.c.flux; BIO.dur = f.orage || f.traitement || f.engrais ? 3.2 : 2.4;
      if (BIO.sides.A.c.fini) { BIO.done = true; BIO.running = false; bioUI(); bioResult(); }
      bioMetrics();
    }
  }
  ['A', 'B'].forEach(L => { const sd = BIO.sides[L]; sd.deco.time += dt; if (BIO.running) emitChamp(sd.P, { c: sd.c, dur: BIO.dur }, dt * BIO.speed); });
  bioDraw(BIO.running ? dt * BIO.speed : 0);
}
function bioDraw(dt) {
  const t = clamp(BIO.tIn / BIO.dur, 0, 1);
  ['A', 'B'].forEach(L => { const sd = BIO.sides[L]; if (!sd.c) return; drawChamp(sd.ctx, { c: sd.c, deco: sd.deco, id: L === 'A' ? 'intensif' : 'bio', t }); stepParticles(sd.P, sd.ctx, dt, !BIO.running); });
}
function bioMetrics() {
  const r = $('#p-bio'), c0 = BIO.sides.A.c;
  $('[data-clock]', r).textContent = c0.mois === 0 ? 'Avant mars' : MOIS_BIO[c0.mois - 1] + (c0.flux.orage ? ' · orage' : '');
  $('[data-prog]', r).style.width = (c0.mois / 12 * 100) + '%';
  ['A', 'B'].forEach(L => {
    const el = BIO.sides[L].el, c = BIO.sides[L].c, set = (k, t, w, col) => { $(`[data-m=${k}]`, el).textContent = t; const b = $(`[data-b=${k}]`, el); b.style.width = clamp(w, 0, 100) + '%'; b.style.background = col; };
    const no3 = c.mois ? nitrates(c) : null, pe = c.mois ? pesticidesUgL(c) : null;
    set('rdt', c.mois >= 5 ? fmt(rendement(c)) : '—', c.mois >= 5 ? rendement(c) : 0, 'var(--b)');
    set('no3', no3 === null ? '—' : fmt(no3) + ' mg/L', no3 || 0, no3 > 50 ? 'var(--bad)' : no3 > 25 ? 'var(--warn)' : 'var(--good)');
    set('pest', pe === null ? '—' : fmt(pe, 2) + ' µg/L', (pe || 0) / 0.5 * 100, pe > 0.1 ? 'var(--bad)' : 'var(--good)');
    set('ruis', c.mois ? fmt(c.ruissel) + ' mm' : '—', c.ruissel / 140 * 100, 'var(--c-sol)');
    set('ero', c.mois ? fmt(c.erosion, 1) + ' t/ha' : '—', c.erosion / 2.5 * 100, '#8A6A3E');
  });
}
function bioResult() {
  const a = BIO.sides.A.c, b = BIO.sides.B.c, res = $('#p-bio [data-result]'); res.className = 'card result';
  res.innerHTML = `<h3>Résultat après un an</h3>
    <div class="cmp"><div><span class="label">A · Intensif</span><b class="n num">${fmt(nitrates(a))} mg/L</b>de nitrates dans l'eau vers la nappe<br><b class="num">${fmt(pesticidesUgL(a), 2)} µg/L</b> de pesticides · rendement <b class="num">${fmt(rendement(a))}</b></div>
    <div class="B"><span class="label">B · Biologique</span><b class="n num">${fmt(nitrates(b))} mg/L</b>de nitrates dans l'eau vers la nappe<br><b class="num">${fmt(pesticidesUgL(b), 2)} µg/L</b> de pesticides · rendement <b class="num">${fmt(rendement(b))}</b></div></div>
    <p style="margin:0">L'eau qui s'infiltre sous le champ intensif ${nitrates(a) > 50 ? 'dépasse la limite de potabilité pour les nitrates' : 'contient beaucoup de nitrates'} et contient des pesticides. Sous le champ bio, elle reste en dessous des limites. Le champ bio a produit environ ${fmt(100 - rendement(b))} % de moins.</p>
    <div class="retenir">À retenir : ${BIO_TAB.retenir}</div>`;
}

/* ======================= ONGLETS ET BOUCLE ======================= */
const TABS = [
  { id: 'labo', nav: 'Le potager expérimental', icon: '<path d="M7 2h6M8 2v5L3 16a1.5 1.5 0 0 0 1.3 2h11.4A1.5 1.5 0 0 0 17 16L12 7V2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M5.5 13h9" stroke="currentColor" stroke-width="1.7"/>' },
  { id: 'bio', nav: 'Bio ou intensif', icon: '<path d="M3 17h14M6 17V9M10 17V6M14 17V9M6 9l-2-2M6 9l2-2M10 6L8 4M10 6l2-2M14 9l-2-2M14 9l2-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>' }
];
let active = 'labo';
function showTab(id) {
  if (!TABS.some(t => t.id === id)) id = 'labo';
  TABS.forEach(t => { $('#p-' + t.id).hidden = t.id !== id; $('#tab-' + t.id).setAttribute('aria-selected', t.id === id); });
  if (id !== 'labo' && LAB.running) { LAB.running = false; labUI(); }
  if (id !== 'bio' && BIO.running) { BIO.running = false; bioUI(); }
  active = id; id === 'labo' ? labDraw(0) : bioDraw(0);
}
function boot() {
  $('#tabs').innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" aria-selected="false" data-tab="${t.id}"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">${t.icon}</svg>${t.nav}</button>`).join('');
  $('main').innerHTML = labHTML() + bioHTML();
  labInit(); bioInit();
  $$('.tab').forEach(b => b.onclick = () => { if (location.hash !== '#' + b.dataset.tab) location.hash = b.dataset.tab; else showTab(b.dataset.tab); });
  addEventListener('hashchange', () => showTab(location.hash.slice(1)));
  showTab(location.hash.slice(1));
  let last = performance.now();
  const loop = now => { const dt = Math.min(0.05, (now - last) / 1000); last = now; active === 'labo' ? labTick(dt) : bioTick(dt); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
boot();
</script>
